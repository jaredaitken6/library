<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
<button type="button" id="openModalBtn">Add New Book</button>

<dialog id="myModal">

  <form id="book-form">
    <!-- Text Input -->
    <div>
      <label for="book-title">Title:</label>
      <input type="text" id="book-title" name="username" placeholder="Harry Potter" required>
    </div>
    <div>
      <label for="book-author">Author:</label>
      <input type="text" id="book-author" name="author" placeholder="J.K. Rowling" required>
    </div>
    <div>
      <label for="page-number">Pages:</label>
      <input type="tel" pattern="[0-9]*" id="page-number" name="page-number" placeholder="Numbers Only" required>
    </div>
    <div>
      <label for="book-genre">Genre:</label>
      <input type="text" id="book-genre" name="genre" placeholder="Fantasy"  required>
    </div>

    <div>
      <input type="checkbox" id="book-read" name="read" value="read" checked>
      <label for="book-read">Read</label>
    </div>

    <button type="submit">Submit Form</button>
    <button type="button" id="closeModalBtn">Close</button>
  </form>

</dialog>

<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Pages</th>
      <th>Genre</th>
      <th>Read</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody>
    <tbody>
      <tr data-book-id="2cc9af29-4add-4dce-be64-25aca3fc76c1">
        <td>harry</td><td>jk</td><td>2435</td><td>fants</td><td>Read</td><td><button type="button" data-book-id="2cc9af29-4add-4dce-be64-25aca3fc76c1">Delete</button></td>
      </tr>
      <tr data-book-id="6a8a9cc8-4b27-4cad-84db-46813895db3f">
        <td>ha</td><td>sadg</td><td>244</td><td>fan</td><td>Read</td><td><button type="button" data-book-id="6a8a9cc8-4b27-4cad-84db-46813895db3f">Delete</button></td>
      </tr>
      <tr data-book-id="41b53a38-07e9-4f81-99a2-30e820488531">
        <td>dune</td><td>frank</td><td>566</td><td>scot</td><td>Not Read</td>
        <td>
          <button type="button" data-book-id="41b53a38-07e9-4f81-99a2-30e820488531">Delete</button>
        </td>
      </tr>
  </tbody>
  </tbody>
</table>
</body>
</html>
